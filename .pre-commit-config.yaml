repos:
  - repo: https://codeberg.org/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  # Upstream esp-matter's formatter, retained now that this repo carries the
  # C/C++ firmware — but scoped to ElaadNL-authored code only.
  #
  # The vendored upstream tree is NOT clang-format clean under this config, so
  # an unscoped `pre-commit run --all-files` would rewrite hundreds of upstream
  # files and destroy the byte-identical property that lets us diff against
  # esp-matter. `files:` therefore restricts the hook to examples/energy_evse/,
  # and `exclude:` drops machine-generated ZAP output and the vendored
  # MIT-licensed Unity sources.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: '0f8362ad84fe4a446b807ffbfc9e65d078ecf732'
    hooks:
      - id: clang-format
        files: '^examples/energy_evse/.*\.(c|cc|cpp|h|hpp)$'
        exclude: '^.*/zap-generated/.*$|^examples/energy_evse/test/host_test/unity.*$'